[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvfp4-stream"
version = "0.1.0"
description = "Direct ModelOpt NVFP4 expert streaming for Nemotron-H models on Apple Silicon"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.scripts]
nvfp4-stream = "nvfp4_stream.cli:main"

[tool.setuptools.packages.find]
include = ["nvfp4_stream*"]

